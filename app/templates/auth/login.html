{% extends "base_auth.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-card">
  <h3>Welcome back</h3>
  <p class="auth-sub">Sign in to monitor your class CodeChef performance.</p>

  <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input type="email" class="form-control" id="email" name="email"
             placeholder="you@college.edu" autocomplete="username" required autofocus>
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password"
             placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn-primary w-100" style="padding:10px;">
      <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
    </button>
  </form>

  <div class="auth-aside-link">
    First time here?
    <a href="{{ url_for('auth.setup') }}">Create the administrator account</a>
  </div>
</div>
{% endblock %}
